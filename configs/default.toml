seed = 42

[paths]
dataset = "data/raw/ultra_feedback.parquet"
evaluation_prompts = "data/evaluation/prompts.xlsx"
sft_checkpoint = "artifacts/models/sft"
reward_checkpoint = "artifacts/models/reward"
ppo_checkpoint = "artifacts/models/ppo"
evaluation_figure = "docs/assets/evaluation.png"

[models]
policy_base = "gpt2"
reward_base = "roberta-base"
max_length = 512
max_new_tokens = 128

[sft]
batch_size = 4
learning_rate = 5e-5
epochs = 1

[reward]
batch_size = 4
learning_rate = 2e-5
epochs = 1
margin = 1.0

[ppo]
learning_rate = 5e-6
update_epochs = 4
clip_epsilon = 0.2
kl_coefficient = 0.005
value_coefficient = 0.05
max_grad_norm = 1.0

[evaluation]
judge_model = "gpt-4o-mini"
prompt_column = "Prompts"
