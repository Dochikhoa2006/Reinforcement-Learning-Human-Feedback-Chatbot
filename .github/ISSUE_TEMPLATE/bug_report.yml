name: Bug report
description: Report a reproducible defect in training, evaluation, or inference.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Include the command, configuration, and smallest relevant sample.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, accelerator, and package version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
