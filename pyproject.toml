[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlhf-chatbot"
version = "1.0.0"
description = "An educational end-to-end RLHF pipeline using GPT-2, RoBERTa, and PPO."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-4.0"}
authors = [{name = "Chi Khoa Do"}]
keywords = ["rlhf", "ppo", "gpt-2", "roberta", "reward-modeling"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.40,<6",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
train = ["pyspark>=3.5"]
evaluation = [
  "matplotlib>=3.8",
  "openai>=1.30",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "python-dotenv>=1.0",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
all = [
  "matplotlib>=3.8",
  "openai>=1.30",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyspark>=3.5",
  "python-dotenv>=1.0",
  "streamlit>=1.35",
]

[project.urls]
Homepage = "https://github.com/Dochikhoa2006/Reinforcement-Learning-Human-Feedback-Chatbot"
Repository = "https://github.com/Dochikhoa2006/Reinforcement-Learning-Human-Feedback-Chatbot"
Issues = "https://github.com/Dochikhoa2006/Reinforcement-Learning-Human-Feedback-Chatbot/issues"

[project.scripts]
rlhf-train-sft = "rlhf_chatbot.cli:train_sft_main"
rlhf-train-reward = "rlhf_chatbot.cli:train_reward_main"
rlhf-train-ppo = "rlhf_chatbot.cli:train_ppo_main"
rlhf-evaluate = "rlhf_chatbot.cli:evaluate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --disable-warnings -q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]
